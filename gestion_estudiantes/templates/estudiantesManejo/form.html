<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Estudiante</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Verdana, Geneva, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding-top: 40px;
            color: #333;
        }

        .card-nuevo {
            background-color: #ffffff;
            width: 360px;
            padding: 30px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .card-nuevo h2 {
            text-align: center;
            font-size: 20px;
            margin-bottom: 20px;
            color: #1976d2;
        }

        .alert {
            padding: 10px;
            background-color: #f8d7da;
            color: #c62828;
            margin-bottom: 15px;
            border-radius: 4px;
            font-size: 14px;
            text-align: center;
        }

        form .campo {
            margin-bottom: 15px;
        }

        form .campo label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }

        form .campo input {
            width: 100%;
            padding: 8px;
            border: 1px solid #999999;
            border-radius: 4px;
            box-sizing: border-box;
        }

        form .campo input:focus {
            border-color: #1976d2;
            outline: none;
        }

        .btn-submit {
            width: 100%;
            padding: 10px;
            background-color: #2e7d32;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
        }

        .btn-back {
            display: block;
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            color: #c62828;
            text-decoration: none;
        }

        .btn-back:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="card-nuevo">
        <h2>Crear Nuevo Estudiante</h2>

        {% if messages %}
            {% for message in messages %}
                <div class="alert">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="campo">
                <label>Nombre del estudiante</label>
                <input type="text" name="nombre_estudiante" placeholder="Nombre del estudiante" required>
            </div>

            <div class="campo">
                <label>Edad</label>
                <input type="number" name="edad" placeholder="Edad del estudiante" required>
            </div>

            <div class="campo">
                <label>Correo electrónico</label>
                <input type="email" name="correo" placeholder="Correo del estudiante" required>
            </div>

            <button type="submit" class="btn-submit">Guardar estudiante</button>
        </form>

        <a href="{% url 'listar_estudiantesManejo_manejo' %}" class="btn-back">◀ Volver al listado</a>
    </div>

</body>
</html>
